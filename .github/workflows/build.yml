name: Test and build GASTROIA Editor
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
  browser:
    name: Browser workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_workflow.py
      - run: python tests/browser_races.py
      - run: python tests/browser_downloads.py
      - run: python tests/browser_docx.py
      - run: python tests/browser_scholarly.py
      - run: python tests/browser_layout_apa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: .qa/
  build-mac:
    name: macOS installer
    needs: [test, browser]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt pyinstaller
      - run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GastroiaEditor-macOS
          path: dist/GastroiaEditor_Installer.dmg
  build-windows:
    name: Windows installer
    needs: [test, browser]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt pyinstaller
      - run: python -m PyInstaller gastroia_editor_windows.spec --noconfirm
      - run: python scripts/check_package_exports.py dist/GastroiaEditor.exe
      - name: Create installer
        run: |
          choco install innosetup --no-progress -y
          iscc gastroia_editor_setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GastroiaEditor-Windows
          path: dist/GastroiaEditor_Setup.exe
  release:
    name: Publish tested release
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GastroiaEditor-*
          merge-multiple: true
          path: release/
      - name: Checksums
        run: cd release && sha256sum *.dmg *.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          name: GASTROIA Editor ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          generate_release_notes: true
          body: |
            GASTROIA Editor: GASTROIA dergisinin makale, jenerik ön sayfa ve sayı düzenlemeleri için masaüstü uygulaması. İlk açılışta hesap oluşturduğunuzda dergi ayarları GASTROIA şablonuyla hazır gelir (sayfa düzeni, APA 7 tercihleri, başlık bandı, kapak ve jenerik şablonu).

            macOS 13 veya üzeri: DMG dosyasını açıp uygulamayı Applications klasörüne sürükleyin. Uygulama Apple noter onayına sahip değildir; ilk açılışta Sistem Ayarları → Gizlilik ve Güvenlik bölümünden izin vermeniz gerekebilir. Windows: GastroiaEditor_Setup.exe dosyasını çalıştırın; Microsoft Edge WebView2 gerekir. Windows SmartScreen imzasız kurulum için uyarı gösterebilir (Daha fazla bilgi → Yine de çalıştır).

            AI-ditor Plus (Alparslan Güvenç, MIT lisansı) tabanlıdır. Lisans ve üçüncü taraf bildirimleri kurulum paketinde yer alır.
          files: release/*
